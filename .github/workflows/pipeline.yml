name: Jobs Paralelos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Job 1: Analise de codigo
  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analise de sintaxe
        run: |
          echo "Running code analysis..."
          sleep 3
          echo "Code analysis completed successfully!"
      - name: Verificar codigo padrão
        run: |
          echo "Verificando padrão do código..."
          sleep 2
          echo "Padrão Verificado com Sucesso!"
      - name: Upload code analysis report
        run: |
          echo "Fazendo upload do relatório de análise de código..."
          echo "relatorio de analise gerado em $(date)" > code-analysis-report.txt
          echo "Relatorio Salvo!"

    # Job 2: Teste unitarios (Exxecutado em paralelo com code-analysis)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Configurar Ambiente de Teste
       run: |
          echo "Configurando ambiente de teste..."
          sleep 2
          echo "Ambiente de teste configurado com sucesso!"
     - name: Executar Testes Unitários
       run: |
          echo "Executando testes unitários..."
          sleep 4
          echo "Todos os testes passaram (15/15)"
     - name: Gerar relatorio de cobertura
       run: |
          echo "Gerando relatorio de cobertura"
          sleep 1
          echo "Cobertura de teste: 85%"

    # Job 3: Build da aplicação (Executa em paralelo)
  build:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Configurar ambiente de build
       run: |
          echo "Configurando ambiente de build..."
          sleep 2
          echo "Ambiente de build configurado com sucesso!"
     - name: Copilar Aplicação
       run: |
          echo "Compilando aplicação..."
          sleep 5
          echo "Build Concluido com sucesso!"
     - name: Gerar Artefatos de Build
       run: |
          echo "Gerando artefatos de build..."
          mkdir -p build
          echo "Aplicação compilada em $(date)" > build/app.jar
          echo "Artefatos de build gerados com sucesso!"

     - name: Upload Build Artifacts
       uses: actions/upload-artifact@v4
       with:
         name: build-artifacts
         path: build/     