name: Issue Triggered Workflow
# Permissoes para permitir comentarios automaticos
permissions:
  issues: write

# Executa quando issues sao abertas, editadas, fechadas
on:
  issues:
    types: [opened, edited, closed, labeled]

jobs:
  issue-job:
    runs-on: ubuntu-latest
    steps:
      - name: Informações da Issue
        run: |
          echo "Worflow acionado por uma nova Issue!"
          echo "Ação: ${{ github.event.action }}"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Titulo: ${{ github.event.issue.title }}"
          echo "Autor: ${{ github.event.issue.user.login }}"
          echo "Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}"

      - name: Resposta automatica (nova Issue)
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Obrigado por abrir esta Issue! Nossa equipe irá analisar e responder o mais breve possível.'
            })