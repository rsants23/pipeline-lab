name: Matrix Strategy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
# Job com matrix para multiplos ambientes
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        on: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
        include:
            #Configurações específicas para cada ambiente
          - os: ubuntu-latest
            node-version: 20
            experiment: true
        exclude:
            #Excluir combinações problemáticas
          - os: windows-latest
            node-version: 16

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Informaçao da matrix
      run: |
        echo "OS: ${{ matrix.os }}"
        echo "Node.js version: ${{ matrix.node-version}}"
        echo "Experiment: ${{ matrix.experiment }}"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Verificando versoes
      run: |
        echo "Node.js version: $(node --version)"
        echo "NPM version: $(npm --version)"

    - name: Executar testes especificos do OS
      run: |
        echo "Running tests on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}"
        sleep 2
        echo "Tests completed"

    - name: Teste Experimental
      if: matrix.experiment == 'true'
      run: |
        echo "Executando teste experimental"
        sleep 1
        echo "teste experimental concluído"

    # Job que coleta resultado da matrix
  collect-results:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
    - name: Coletar resultados
      run: |
        echo "Coletando resultados de todos os testes da matrix"
        echo "Todos os testes da matrix foram concluídos com sucesso"
        